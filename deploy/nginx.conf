# Nginx server block for the Steam Matchmaking Platform.
#
#   server {
#       listen 443 ssl http2;
#       server_name lfg.example.com;
#       include /var/www/steam-matchmaking-platform/deploy/nginx.conf;
#   }

root /var/www/steam-matchmaking-platform/public;
index index.php;

charset utf-8;

# The application directories live outside the document root; refuse any
# attempt to reach them by path.
location ~ ^/(config|db|services|tests|deploy)(/|$) {
    return 404;
}

location ~ /\. {
    return 404;
}

# Static assets: long-lived immutable caching is safe because the service
# worker and the browser revalidate on deploy via the versioned cache name.
location ~* \.(css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}

location / {
    try_files $uri /router.php?$query_string;
}

# /api/*.php lives outside the document root. Run those requests through the
# front controller instead of looking for a file under public/; this regex
# must stay above the generic \.php$ block (first regex match wins).
location ~ ^/api/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/router.php;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    fastcgi_read_timeout 30s;
}

location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    fastcgi_read_timeout 30s;
}

# Do not let the server reveal its version.
server_tokens off;
