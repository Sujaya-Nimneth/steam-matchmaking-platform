# Apache virtual host for the Steam Matchmaking Platform.
#
#   <VirtualHost *:443>
#       ServerName lfg.example.com
#       DocumentRoot /var/www/steam-matchmaking-platform/public
#       Include /var/www/steam-matchmaking-platform/deploy/apache.conf
#   </VirtualHost>
#
# Requires mod_rewrite and mod_headers.

<Directory /var/www/steam-matchmaking-platform/public>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted

    # Never serve dotfiles.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    RewriteEngine On

    # Existing files (assets) are served directly.
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule ^ - [L]

    # Everything else goes through the front controller, which also dispatches
    # /api/*.php to the api/ directory outside the document root.
    RewriteRule ^ router.php [L]
</Directory>

# The application lives outside the document root; make sure it is not
# reachable through any alias.
RedirectMatch 404 ^/(config|db|services|tests|deploy)(/|$)

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>
