# Apache virtual host used by the Docker image. It mirrors deploy/apache.conf:
# public/ is the document root, and every non-file request runs through the
# router.php front controller, which dispatches /api/*.php to the application
# directory outside the document root.

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted

        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>

        RewriteEngine On

        # Existing files (assets) are served directly.
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]

        # Everything else goes through the front controller.
        RewriteRule ^ router.php [L]
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    # The application emits its own Cache-Control and CSP; keep the server quiet.
    ServerSignature Off
    ServerTokens Prod
</VirtualHost>
